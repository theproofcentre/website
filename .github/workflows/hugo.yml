# GitHub Actions workflow to sync data from Google Sheets, build and deploy Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"

  # Nightly scheduled check to sync latest Google Sheets content
  schedule:
    - cron: "0 6 * * *"

  # Allows manual triggering from the Actions tab
  workflow_dispatch:

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and data commits
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check_deploy.outputs.proceed }}
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Sync Google Sheets Data
        id: sync
        run: python scripts/sync_sheets_to_yaml.py

      - name: Commit Google Sheets updates
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): auto-sync Google Sheets content [skip ci]"
          git push

      - name: Determine if build & deploy is needed
        id: check_deploy
        run: |
          DAY_OF_MONTH=$(date +%d)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.sync.outputs.has_changes }}" = "true" ] || [ "$DAY_OF_MONTH" = "01" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "Proceeding with Hugo build and deployment."
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "No changes in Google Sheets and not 1st of month. Skipping build and deployment."
          fi

      - name: Install Hugo CLI
        if: steps.check_deploy.outputs.proceed == 'true'
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Pages
        if: steps.check_deploy.outputs.proceed == 'true'
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Hugo
        if: steps.check_deploy.outputs.proceed == 'true'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url || 'https://theproofcentre.github.io/website' }}/"

      - name: Upload artifact
        if: steps.check_deploy.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.proceed == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
