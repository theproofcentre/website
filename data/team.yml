- name: Estefanía Espín
  role: PhD Candidate
  mini_bio: Investigates Long COVID heterogeneity by bridging qualitative patient
    and clinician insights with high-dimensional transcriptomic and metabolomic biomarker
    discovery and clinical validation.
  bio: |-
    Estefanía Espín Armas is a PhD Candidate in Experimental Medicine at the University of British Columbia under Dr. Scott Tebbutt at the Centre for Heart Lung Innovation. Her doctoral research addresses the clinical and molecular heterogeneity of Long COVID, combining qualitative insights from patients and healthcare professionals with transcriptomic and metabolomic biomarker discovery.

    Bringing over a decade of biomedical research experience, she previously served for five years as a university lecturer in Medical Genetics and Cellular Biology in Ecuador. She holds a Master’s in Biomedical Biotechnology with distinction from the Polytechnic University of Valencia.
