- name: Dr. Scott Tebbutt
  role: CEO & CSO
  mini_bio: Professor in the Dept. of Medicine at UBC & PI at Centre for Heart Lung
    Innovation. Directs biomarker discovery and translational multi-omics programs.
  bio: |-
    Dr. Scott Tebbutt is Chief Executive Officer and Chief Scientific Officer of the PROOF Centre of Excellence. He provides overall scientific leadership and operational vision for the Centre, directing translational programs in multi-omic biomarker discovery, development, and implementation across heart failure, organ transplantation, respiratory diseases, and infectious disease.

    Dr. Tebbutt is also Professor in the Department of Medicine (Division of Respiratory Medicine) at the University of British Columbia, and Principal Investigator and Director of Education at the Centre for Heart Lung Innovation (HLI) at St. Paul’s Hospital. He has served on numerous international advisory bodies, including the NIH Human Immunology Project Consortium (HIPC) and the CEPI Systems Immunology Task Force. He holds a B.A. in biochemistry from the University of Oxford and a Ph.D. in molecular genetics from the University of East Anglia.
  orcid: 0000-0002-7908-1581
