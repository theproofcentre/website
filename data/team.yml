- name: Dr. Chengliang Yang
  role: Research Associate
  mini_bio: Specializes in Ex Vivo Lung Perfusion (EVLP) and multi-omic profiling
    to develop non-invasive biomarkers for heart and lung transplantation and Long
    COVID.
  bio: |-
    Dr. Chengliang Yang, MD, MSc, is a Transplant Scientist and Ex Vivo Lung Perfusion (EVLP) Specialist at the PROOF Centre and the Centre for Heart Lung Innovation (HLI), UBC. Working at the intersection of organ transplantation, immunology, and multi-omics, he develops and validates non-invasive blood biomarkers to improve diagnosis and risk assessment in heart and lung transplantation, as well as Long COVID.

    He completed his postdoctoral fellowship and EVLP specialist training at the Latner Thoracic Surgery Research Laboratories and Toronto Lung Transplant Program (UHN/University of Toronto). Dr. Yang is also an active Senior Collaborator in the Global Burden of Disease (GBD) network.
