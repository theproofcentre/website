- name: Sara Assadian
  role: Director of Clinical Research
  mini_bio: Oversees clinical trial operations, biospecimen registries, regulatory
    compliance, and translational study logistics across partner clinical centres.
  bio: |-
    Sara Assadian is Director of Clinical Research at the PROOF Centre of Excellence. She oversees clinical operations, study governance, regulatory compliance, and protocol execution across all PROOF biomarker discovery and validation programs. Working closely with Canadian and international trial sites, she manages patient recruitment protocols, ethics approvals, and clinical biospecimen repositories from study inception through clinical translation.

    Prior to joining the PROOF Centre, Sara coordinated multi-centre clinical trials examining novel immunosuppressive medications in solid organ transplantation at BC Transplant. She holds a Bachelor’s degree in Clinical Psychology from the University of British Columbia and a Master’s in Health Studies from Athabasca University.
