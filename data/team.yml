- name: Casey Shannon
  role: Director of Data Science
  mini_bio: Leads computational biology and data science at the PROOF Centre, developing
    multi-omic pipelines to translate complex molecular data into non-invasive clinical
    biomarkers.
  bio: |-
    Casey Shannon is Director of Data Science at the PROOF Centre of Excellence at the University of British Columbia (UBC). Working at the interface of computer science, statistics, and biology, he develops computational pipelines and statistical learning frameworks to interpret high-dimensional multi-omic data from complex clinical cohorts. Committed to open science, he co-developed the DIABLO framework in mixOmics along with methods for in silico cell deconvolution.

    Casey's translational work includes serving as computational lead for HEARTBiT, a blood-based gene expression test for detecting acute cellular rejection in heart transplant recipients. He also contributes computational leadership to international initiatives investigating infant vaccine response (EPIC), COVID-19 trajectories (IMPACC), and cardiopulmonary biomarkers. He completed dual degrees in Cell Physiology & Genetics and Computer Science at UBC.
  orcid: 0000-0002-5687-3156
